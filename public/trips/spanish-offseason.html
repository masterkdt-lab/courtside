is and a farewell dinner. Saturday: breakfast and departure.</p><p>From $2,995 per player (shared-room starting estimate). Private groups of 4–12 players; non-playing partners welcome; solo travelers can ask Courtside to help find a group. A request starts a conversation: no payment, and your place is confirmed only after the booking steps in your personal proposal.</p></section></noscript></main><footer class="foot"><a href="/" class="logo">Courtside<small>TRAVEL CO.</small></a><div>Travel with your pro. We take care of the journey.<br><span class="small">powered by tgl.rsvp</span></div><div class="footlinks"><a href="/about">About Courtside</a><a href="/apply">Apply to host</a><a href="/privacy">Privacy</a></div></footer><div id="overlay"></div><div id="live" role="status" aria-live="polite"></div><script src="/analytics.js"></script><script src="/pages.js"></script><script src="/app.js"></script></body></html>
